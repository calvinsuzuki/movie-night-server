<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Movie night</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <video id="video" playsinline autoplay muted></video>

  <div id="overlay">
    <h1 id="brand">Movie night</h1>

    <form id="askForm" class="screen">
      <label for="name">Your name, so the host knows who's asking</label>
      <input id="name" type="text" maxlength="20" autocomplete="nickname" placeholder="Your name" required>
      <button id="ask" class="primary" type="submit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span>Ask to join</span>
      </button>
    </form>

    <div id="waiting" class="screen" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="waitText">Waiting for the host to let you in…</p>
      <button id="cancel" class="secondary" type="button">Cancel</button>
    </div>

    <div id="notice" class="screen" hidden>
      <div id="goodbye" hidden>
        <div class="popcorn" aria-hidden="true">🍿</div>
        <h2>That's a wrap!</h2>
      </div>
      <p id="noticeText"></p>
      <button id="again" class="primary" type="button">Ask again</button>
    </div>

    <div id="tapToPlay" class="screen" hidden>
      <button id="play" class="primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span>Start watching</span>
      </button>
    </div>
  </div>

  <div id="throws" aria-hidden="true"></div>

  <div id="controls">
    <div id="thrower" hidden>
      <button id="throwBtn" type="button" aria-label="Throw an emoji at the screen" title="Throw it!">🍿</button>
      <button id="emojiPick" type="button" aria-label="Choose what to throw" aria-haspopup="true" aria-expanded="false" aria-controls="emojiMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>
      </button>
      <div id="emojiMenu" role="menu" aria-label="Choose what to throw" hidden></div>
    </div>
    <div id="watchers" hidden>
      <button id="watchersBtn" type="button" aria-label="Who's watching" aria-expanded="false" aria-controls="watcherList">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>
        <span id="watcherCount">0</span>
      </button>
      <div id="watcherList" role="tooltip">
        <p class="title">Watching now</p>
        <ul id="watcherNames"></ul>
      </div>
    </div>
    <button id="mute" type="button" aria-label="Mute">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </button>
    <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    <span id="volLabel">80%</span>
    <span id="state" class="pill">offline</span>
    <span class="spacer"></span>
    <button id="statsBtn" type="button" aria-label="Stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z"/></svg>
    </button>
    <button id="fs" type="button" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>

  <div id="joined" aria-live="polite"></div>

  <div id="quality" hidden aria-live="off">
    <span><span id="qRes">–</span> <span class="fps" id="qFps"></span></span>
    <span id="qRate"></span>
    <span class="sep" aria-hidden="true"></span>
    <span title="Round trip to the host"><span class="dot" aria-hidden="true"></span><span id="qPing">– ms</span></span>
  </div>
  <pre id="stats" hidden></pre>
</div>
<script src="app.js"></script>
</body>
</html>
